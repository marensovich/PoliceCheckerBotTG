telegram:
  bot:
    token: ${BOT_TOKEN}
    username: ${BOT_USERNAME}
    miniapp-url: ${MINIAPP_URL:http://localhost:5173}
  auth:
    max-age-seconds: 86400

spring:
  application:
    name: dps-tracker-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dpstracker}
    username: ${DB_USER:dpstracker}
    password: ${DB_PASSWORD:dpstracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false


server:
  port: 8080
  error:
    include-message: always

app:
  live-tracking:
    interval-seconds: 15
    notification-cooldown-minutes: 10
  subscription:
    price-stars: 100
    duration-days: 30
  rate-limit:
    posts-per-hour: 5
